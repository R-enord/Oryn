name: ci (v2 lint + tests)

on:
  push:
    paths: ["radar/**", "tests/**", "pyproject.toml", "config.yaml", "profile.yaml", "Makefile", ".github/workflows/ci.yml"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: make check
