name: digest (daily research + email)

on:
  schedule:
    - cron: "5 6 * * *"    # 06:05 UTC = 07:05 in Lagos, every day
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: money-radar
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Research and send digest
        run: python -m agent digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
      - name: Save state
        run: |
          git config user.name "money-radar-bot"
          git config user.email "money-radar-bot@users.noreply.github.com"
          git add state/
          if ! git diff --cached --quiet; then
            git commit -m "state: digest $(date -u +%F)"
            git pull --rebase --quiet && git push --quiet
          fi
