name: watch (hourly alerts)

on:
  schedule:
    - cron: "23 * * * *"   # every hour at :23 (UTC). Change to "23 */2 * * *" for every 2 hours.
  workflow_dispatch:        # lets you press "Run workflow" by hand

permissions:
  contents: write           # needed to save state/ back to the repo

concurrency:
  group: money-radar        # watch and digest never run at the same time
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check feeds and send alerts
        run: python -m agent watch
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Save state
        run: |
          git config user.name "money-radar-bot"
          git config user.email "money-radar-bot@users.noreply.github.com"
          git add state/
          if ! git diff --cached --quiet; then
            git commit -m "state: watch $(date -u +%F_%H:%M)"
            git pull --rebase --quiet && git push --quiet
          fi
