[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "money-radar"
version = "2.0.0a0"
description = "Salam's always-on opportunity radar (v2 service)"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2,<3",
    "APScheduler>=3.10,<4",
    "feedparser>=6.0",
    "httpx>=0.27,<1",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-telegram-bot>=21,<23",
    "PyYAML>=6.0",
    "tzdata",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["radar*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:feedparser.*"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["agent"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S"]
ignore = [
    "E501",   # long prompt strings and HTML templates read better unwrapped
    "S101",   # assert is fine in tests
    "S311",   # random is not used for crypto
    "S608",   # SQL is built from fixed fragments only, values are bound
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
